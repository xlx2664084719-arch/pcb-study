<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="920" height="560" fill="#0b1220"/>
  <text x="30" y="46" fill="#e6edf3" font-size="25" font-weight="600">四层叠层剖面 · SIG / GND / PWR / SIG</text>
  <text x="30" y="74" fill="#8b98a5" font-size="15">嘉立创 4 层标准叠层 JLC04161H-7628 · 总厚 1.5862 mm（含铜） · 板厚 1.6 mm 档</text>

  <!-- 左侧总厚标注 -->
  <line x1="66" y1="112" x2="66" y2="504" stroke="#8b98a5" stroke-width="1.4"/>
  <line x1="60" y1="112" x2="72" y2="112" stroke="#8b98a5" stroke-width="1.4"/>
  <line x1="60" y1="504" x2="72" y2="504" stroke="#8b98a5" stroke-width="1.4"/>
  <text x="20" y="300" fill="#8b98a5" font-size="13" transform="rotate(-90 20 300)" text-anchor="middle">1.5862 mm</text>

  <!-- 层块：y 与高度按真实厚度比例放大（0.035→14, 0.2104→84.2, 0.0152→6.1, 1.065→426） -->
  <g>
    <!-- L1 -->
    <rect x="96" y="112" width="470" height="14" fill="#e84c34"/>
    <text x="586" y="124" fill="#e6edf3" font-size="15" font-weight="600">L1  SIG（顶层信号）</text>
    <text x="586" y="142" fill="#8b98a5" font-size="13">35 µm 铜 · 微带线参考 L2，50 Ω 线宽约 0.3~0.4 mm</text>
    <!-- prepreg -->
    <rect x="96" y="126" width="470" height="84" fill="#1d2b40"/>
    <text x="586" y="162" fill="#c9d5e1" font-size="14">介质 210 µm（prepreg，Dk ≈ 4.4）</text>
    <text x="586" y="180" fill="#8b98a5" font-size="12.5">半固化片，压合后成"胶"层</text>
    <!-- L2 -->
    <rect x="96" y="210" width="470" height="7" fill="#2a9e6c"/>
    <text x="586" y="217" fill="#e6edf3" font-size="15" font-weight="600">L2  GND（内电层，负片）</text>
    <text x="586" y="235" fill="#8b98a5" font-size="13">整片地平面 · 不作任何分割（L1 的完整参考面）</text>
    <!-- core -->
    <rect x="96" y="217" width="470" height="213" fill="#16233a"/>
    <text x="586" y="300" fill="#c9d5e1" font-size="14">芯板 1065 µm（core）</text>
    <text x="586" y="318" fill="#8b98a5" font-size="12.5">FR-4 · 中间夹层，两侧铜箔对称</text>
    <!-- L3 -->
    <rect x="96" y="430" width="470" height="7" fill="#e8a63e"/>
    <text x="586" y="437" fill="#e6edf3" font-size="15" font-weight="600">L3  PWR（内电层，负片，含分割）</text>
    <text x="586" y="455" fill="#8b98a5" font-size="13">+5 V 整片 + 一路 −5 V 孤岛（0.254 mm 隔离缝）· L4 的参考面</text>
    <!-- prepreg -->
    <rect x="96" y="437" width="470" height="53" fill="#1d2b40"/>
    <text x="586" y="470" fill="#c9d5e1" font-size="14">介质 210 µm（prepreg，Dk ≈ 4.4）</text>
    <!-- L4 -->
    <rect x="96" y="490" width="470" height="14" fill="#3a86e2"/>
    <text x="586" y="502" fill="#e6edf3" font-size="15" font-weight="600">L4  SIG（底层信号）</text>
    <text x="586" y="520" fill="#8b98a5" font-size="13">35 µm 铜 · 参考 L3（电源平面）</text>
  </g>

  <!-- 右侧回流说明 -->
  <rect x="30" y="536" width="860" height="0" fill="none"/>
  <text x="96" y="546" fill="#f0c878" font-size="13.5">关键：L1 的信号回流走 L2（完整地，不受 L3 分割影响）；L4 的信号回流走 L3，跨过 −5 V 隔离缝就会断回流路径 ✗</text>
</svg>
